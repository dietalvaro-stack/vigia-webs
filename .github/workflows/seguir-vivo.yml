# GitHub apaga las tareas programadas si el repo pasa 60 días sin cambios. Esto apunta la fecha una vez al mes.
name: Seguir vivo
on:
  schedule:
    - cron: '17 4 1 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  latido:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%F > ultima-vuelta.txt
          git config user.name vigia-webs
          git config user.email vigia-webs@users.noreply.github.com
          git add ultima-vuelta.txt
          git commit -m "Latido mensual" || exit 0
          git push
